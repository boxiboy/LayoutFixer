# Pushing a version tag (v0.2.0, v0.3.0, ...) builds the macOS and Windows apps and publishes
# them together as one GitHub release. Asset names carry no version, so the README can link to
# releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/LayoutFixer-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build x64 and ARM64
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish windows/LayoutFixer.Windows.csproj -c Release -r "win-$arch" --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version=$version `
              -o "dist/$arch/LayoutFixer"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "dist/$arch/LayoutFixer" -DestinationPath "dist/LayoutFixer-Windows-$arch.zip"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/*.zip \
            --verify-tag \
            --title "LayoutFixer ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
