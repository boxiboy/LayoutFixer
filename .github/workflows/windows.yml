# Builds the Windows app on every push to the `windows` branch and publishes it as the
# "windows-preview" pre-release. Pre-releases never become "Latest", so the macOS download is unaffected.
name: Windows preview build

on:
  push:
    branches: [windows]
    paths:
      - 'windows/**'
      - 'Resources/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build x64 and ARM64
        shell: pwsh
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/LayoutFixer.Windows.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none `
              -o "dist/$rid/LayoutFixer"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "dist/$rid/LayoutFixer" -DestinationPath "dist/LayoutFixer-windows-$rid.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: LayoutFixer-windows
          path: dist/*.zip

      - name: Publish the windows-preview pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-preview --yes --cleanup-tag || true
          gh release create windows-preview dist/*.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "LayoutFixer for Windows (preview)" \
            --notes "Preview build of the \`windows\` branch (${GITHUB_SHA::7}). Not tested widely yet: please report anything odd.

          **Install:** download the zip for your PC (\`x64\` for most PCs, \`arm64\` for Snapdragon/ARM laptops), unzip it anywhere and run \`LayoutFixer.exe\`. It lives in the system tray.

          You need both an English and a Persian keyboard layout (Settings → Time & language → Language & region).

          Windows may show *Windows protected your PC* because the app isn't code-signed yet: click **More info → Run anyway**."
